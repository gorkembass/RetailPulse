[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "1.0.0"
description = "End-to-end e-commerce analytics on the UCI Online Retail dataset with PostgreSQL and pandas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=3.0",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.50",
    "plotly>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
retailpulse = "retailpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable PostgreSQL instance (set RETAILPULSE_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["retailpulse", "tests"]
known-local-folder = ["charts", "data_access", "views"]
